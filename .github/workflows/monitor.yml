name: Social Media Monitor

on:
  repository_dispatch:
    types: [social-monitor-trigger]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run social media monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 -u social_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "social-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Update seen-posts state [skip ci]" && git pull --rebase && git push)
